name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop app (and FFmpeg, which the video tests decode with)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev fonts-dejavu-core ffmpeg
      - run: cargo xtask ci

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the web app (wasm + wasm-bindgen into dist/web)
        run: cargo xtask web
      - uses: actions/upload-artifact@v7
        with:
          name: genha-web
          path: dist/web
