name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev fonts-dejavu-core
      - run: cargo xtask ci
