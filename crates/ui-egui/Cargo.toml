[package]
name = "genha-ui-egui"
description = "GenHa user interface (egui): home screen, editor, panels, canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
genha-engine = { workspace = true }
genha-doc = { workspace = true }
genha-geom = { workspace = true }
genha-color = { workspace = true }
genha-text = { workspace = true }
genha-render = { workspace = true }
genha-effects = { workspace = true }
genha-layout = { workspace = true }
genha-templates = { workspace = true }
genha-tools = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }

epaint_default_fonts = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

# The browser: file pickers, downloads, the clock (src/web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "CssStyleDeclaration", "File", "FileList", "Blob", "BlobPropertyBag", "Url"] }

[lints]
workspace = true
