[package]
name = "genha-cli"
description = "GenHa command line: export, scripts, quick actions and the MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
genha-engine = { workspace = true, features = ["ml"] }
genha-text = { workspace = true }
genha-render = { workspace = true }
genha-mcp = { workspace = true }
genha-segment = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
genha-brand = { workspace = true }

# Windows: the icon and version information in the executable (build.rs; MIT).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[lints]
workspace = true
