[package]
name = "genha"
description = "GenHa: an open-source design app for social posts, flyers, presentations and more"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
genha-engine = { workspace = true, features = ["ml"] }
genha-ui-egui = { workspace = true }
genha-text = { workspace = true }
genha-brand = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }

# macOS: files opened from Finder arrive through an application delegate (src/macos.rs). The same
# versions eframe uses (MIT OR Apache-2.0 / MIT, Zlib, Apache-2.0).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[build-dependencies]
genha-brand = { workspace = true }

# Windows: the icon and version information in the executable (build.rs; MIT).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
genha-format = { workspace = true }

[lints]
workspace = true
