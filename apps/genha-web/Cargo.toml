[package]
name = "genha-web"
description = "GenHa in the browser: the same UI through eframe's web runner (WebGL2)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "genha-web"
path = "src/main.rs"

[dependencies]
genha-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "MediaQueryList"] }

[features]
# AI background removal in the browser (`cargo xtask web --ml`): about 11 MB more WebAssembly.
ml = ["genha-ui-egui/ml"]

[lints]
workspace = true
