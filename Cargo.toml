[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/genha", "apps/genha-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/DJTobi24/genexpress"

[workspace.dependencies]
# internal
genha-geom = { path = "crates/geom" }
genha-i18n = { path = "crates/i18n" }
genha-color = { path = "crates/color" }
genha-doc = { path = "crates/doc" }
genha-text = { path = "crates/text" }
genha-effects = { path = "crates/effects" }
genha-layout = { path = "crates/layout" }
genha-motion = { path = "crates/motion" }
genha-templates = { path = "crates/templates" }
genha-render = { path = "crates/render" }
genha-svg = { path = "crates/svg" }
genha-pdf = { path = "crates/pdf" }
genha-video = { path = "crates/video" }
genha-segment = { path = "crates/segment" }
genha-format = { path = "crates/format" }
genha-tools = { path = "crates/tools" }
genha-engine = { path = "crates/engine" }
genha-ui-egui = { path = "crates/ui-egui" }
genha-mcp = { path = "crates/mcp" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
peniko = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
log = "0.4"
# The system's (or the browser's) language for the UI (MIT OR Apache-2.0).
sys-locale = "0.3"
proptest = "1"
qrcode = { version = "0.14", default-features = false }
# SHA-256 for checking downloaded models (MIT OR Apache-2.0, pure Rust)
sha2 = "0.11"

# rendering / formats
vello_cpu = "0.2"
# Filter types (Gaussian blur, drop shadow) are not re-exported by vello_cpu 0.2.
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Animated PNG (APNG) export; the same version `image` uses.
png = "0.18"
skrifa = "0.44"
# Text shaping (MIT): the pure-Rust HarfBuzz port. 0.12 is the release built on the same
# read-fonts (0.41) as skrifa 0.44 and egui's epaint, so the app carries one font parser.
harfrust = "0.12"
# Bidi (UAX #9), line breaking (UAX #14), scripts and grapheme clusters (MIT OR Apache-2.0;
# unicode-linebreak: Apache-2.0)
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"
# SVG import (Apache-2.0 OR MIT); without text so it needs no font database and builds for wasm
usvg = { version = "0.45", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Vector PDF export (MIT OR Apache-2.0): fonts embedded and subsetted, images, gradients, masks.
# No `simple-text` (we place glyphs ourselves) and no `rayon` (threads are not available in wasm).
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
# Reading PDFs back in tests (MIT).
lopdf = { version = "0.45", default-features = false }

# Machine learning: ONNX inference in pure Rust (MIT OR Apache-2.0). No default features: the
# transformer operators are not needed by segmentation models.
tract-onnx = { version = "0.23.8", default-features = false }
# Model downloads on the desktop (MIT OR Apache-2.0): rustls (with ring) and the operating system's
# certificate verifier, so proxies with their own certificate authority work. No gzip, no cookies.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Pictures on the system clipboard (the same version and features egui-winit uses).
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# The local time of day for the home screen's greeting (desktop; the browser asks JavaScript's Date).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
# Fallback fonts for the browser (no system fonts there): egui's own, shipped as a crate
# (Ubuntu Font Licence 1.0, OFL-1.1, MIT/Bitstream Vera; see NOTICE). No font files in this repo.
epaint_default_fonts = "0.36"

# web build (wasm32 only)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# GenHa never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Never crash). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (`cargo xtask web`, which uses only this profile): smaller code over faster
# code, with whole-program LTO, since every byte is downloaded. `panic` is left as it is: wasm32
# aborts on panic anyway (`genha_engine::guard` only catches panics in native builds).
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
